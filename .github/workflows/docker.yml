name: Docker 

on: 
    pull_request: 
        branches: 
            - main 
            - staging 
            - develop 

    push: 
        branches: 
            - main
            - staging 
            - develop 

    workflow_dispatch: 
        
permissions: 
    contents: read 
    packages: write 
    security-events: write 
    id-token: write 
    attestations: write 
    
concurrency: 
    group: docker-${{ github.ref }} 
    cancel-in-progress: true 
    
env: 
    REGISTRY: ghcr.io 
    IMAGE_NAME: ${{ github.repository }} 

jobs: 
    docker-build: 
        name: Build Docker Image 
        runs-on: ubuntu-latest 
    
        outputs: 
            image: ${{ steps.image.outputs.image }} 
            digest: ${{ steps.build.outputs.digest }} 
            
        steps: 
            - name: Checkout Repository 
              uses: actions/checkout@v4 

            - name: Lowercase image name
              shell: bash
              run: |
                echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
            
            - name: Setup Docker Buildx 
              uses: docker/setup-buildx-action@v3 
            
            - name: Lint Dockerfile 
              uses: hadolint/hadolint-action@v3.1.0 
              with: 
                dockerfile: Dockerfile 
                failure-threshold: error 

            - name: Extract Docker Metadata 
              id: meta 
              uses: docker/metadata-action@v5 
              with: 
                images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} 
                tags: | 
                    type=sha 
                    type=ref,event=branch 
                    type=ref,event=tag 
                    
            - name: Login to GitHub Container Registry 
              uses: docker/login-action@v3 
              with: 
                registry: ${{ env.REGISTRY }} 
                username: ${{ github.actor }} 
                password: ${{ secrets.GITHUB_TOKEN }} 
                
            - name: Build and Push Docker Image 
              id: build 
              uses: docker/build-push-action@v6 
              with: 
                context: . 
                file: Dockerfile 
                push: ${{ github.event_name == 'push' }} 
                tags: ${{ steps.meta.outputs.tags }} 
                labels: ${{ steps.meta.outputs.labels }} 
                
                cache-from: type=gha 
                cache-to: type=gha,mode=max 
                
                provenance: true 
                sbom: true 
                
            - name: Set Image Output 
              id: image 
              run: | 
                IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" 
                echo "image=$IMAGE" >> "$GITHUB_OUTPUT" 
         
                
    docker-scan: 
        name: Scan Docker Image 
        needs: docker-build 
        if: github.event_name == 'push' 
        runs-on: ubuntu-latest 
        
        steps: 
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Lowercase image name
              shell: bash
              run: |
                echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

            - name: Login to GitHub Container Registry 
              uses: docker/login-action@v3 
              with: 
                registry: ${{ env.REGISTRY }} 
                username: ${{ github.actor }} 
                password: ${{ secrets.GITHUB_TOKEN }} 
                
            - name: Pull Image 
              run: | 
                docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.digest }}" 
                
            - name: Verify Non-Root Execution 
              run: | 
                IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.digest }}" 
                USER_VAL=$(docker inspect --format='{{.Config.User}}' "$IMAGE") 
                echo "Configured container user: '$USER_VAL'" 
                if [ -z "$USER_VAL" ] || [ "$USER_VAL" = "root" ] || [ "$USER_VAL" = "0" ]; then 
                    echo "SECURITY FAILURE: Container is running as root." 
                    exit 1 
                fi 
                echo "Container runs as non-root user: $USER_VAL" 

                
            - name: Scan Docker Image 
              uses: aquasecurity/trivy-action@v0.36.0 
              with: 
                image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.digest }} 
                format: sarif 
                output: trivy-vulnerability.sarif 
                severity: HIGH,CRITICAL 
                ignore-unfixed: true 
                exit-code: "0" 
                
                
            - name: Upload Vulnerability Report 
              if: always() && hashFiles('trivy-vulnerability.sarif') != '' 
              uses: github/codeql-action/upload-sarif@v3 
              with: 
                sarif_file: trivy-vulnerability.sarif 
                category: trivy-vulnerabilities 

            - name: Scan Repository Configuration 
              uses: aquasecurity/trivy-action@v0.36.0 
              with: 
                scan-type: config 
                scan-ref: . 
                hide-progress: true 
                format: sarif 
                output: trivy-config.sarif 
                severity: HIGH,CRITICAL 
                exit-code: "0" 
                
            - name: Upload Configuration Report 
              if: always() && hashFiles('trivy-config.sarif') != '' 
              uses: github/codeql-action/upload-sarif@v3 
              with: 
                sarif_file: trivy-config.sarif 
                category: trivy-misconfiguration 
                
            - name: Upload Security Reports 
              if: always() 
              uses: actions/upload-artifact@v4 
              with: 
                name: docker-security-reports 
                path: | 
                    trivy-vulnerability.sarif 
                    trivy-config.sarif 
            
            - name: Enforce Vulnerability Policy
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.digest }}
                format: table
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: "1"
                    
                    
    docker-sign: 
        name: Sign Docker Image 
        needs: 
            - docker-build 
            - docker-scan 

        if: github.event_name == 'push' 
        runs-on: ubuntu-latest 
        
        steps: 
            - name: Install Cosign 
              uses: sigstore/cosign-installer@v3.5.0 

            - name: Lowercase image name
              shell: bash
              run: |
                echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

            - name: Login to GitHub Container Registry 
              uses: docker/login-action@v3 
              with: 
                registry: ${{ env.REGISTRY }} 
                username: ${{ github.actor }} 
                password: ${{ secrets.GITHUB_TOKEN }} 
                
            - name: Sign Image 
              run: | 
                IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.digest }}" 
                echo "Signing image:" 
                echo "$IMAGE" 
                cosign sign --yes "$IMAGE" 
                
                
    notify: 
        needs: 
            - docker-build 
            - docker-scan 
            - docker-sign 

        if: always()

        uses: ./.github/workflows/notifications.yml 
        with: 
            status: | 
                build:${{ needs.docker-build.result }} 
                scan:${{ needs.docker-scan.result }} 
                sign:${{ needs.docker-sign.result }} 

            environment: ${{ github.head_ref || github.ref_name }} 
            title: Docker Pipeline 
            message: Docker image built, scanned, signed and published. 

        secrets: inherit