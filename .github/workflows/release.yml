name: Release 

on: 
    push:
         tags: 
            - "v*.*.*" 
            
permissions: 
    contents: write 
    packages: write 
    id-token: write 
    attestations: write 
    
concurrency: 
    group: release-${{ github.ref }} 
    cancel-in-progress: false 
    
env: 
    REGISTRY: ghcr.io 
    IMAGE_NAME: ${{ github.repository }} 
    
    
jobs: 
    release: 
        name: Promote Docker Image 
        runs-on: ubuntu-latest 
        
        steps: 
            - name: Checkout Repository 
              uses: actions/checkout@v4 
              
            - name: Extract Version 
              id: version 
              run: | 
                echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT" 
                
            - name: Install Cosign 
              uses: sigstore/cosign-installer@v3.5.0 
              
            - name: Login to GHCR 
              uses: docker/login-action@v3  
              with: 
                registry: ${{ env.REGISTRY }} 
                username: ${{ github.actor }} 
                password: ${{ secrets.GITHUB_TOKEN }} 
                
            - name: Pull SHA Image 
              run: | 
                IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" 
                docker pull "$IMAGE:sha-${{ github.sha }}" 
                
            - name: Promote Image 
              run: | 
                IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" 
                VERSION="${{ steps.version.outputs.VERSION }}" 
                
                docker tag "$IMAGE:sha-${{ github.sha }}" "$IMAGE:$VERSION" 
                docker tag "$IMAGE:sha-${{ github.sha }}" "$IMAGE:stable" 
                
                docker push "$IMAGE:$VERSION" 
                docker push "$IMAGE:stable" 
                
            - name: Sign Release Image 
              run: | 
                IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" 
                VERSION="${{ steps.version.outputs.VERSION }}" 
                DIGEST=$(docker inspect \ 
                    --format='{{index .RepoDigests 0}}' \ 
                    "$IMAGE:$VERSION") 
                    
                cosign sign --yes "$DIGEST" 
                

    github-release: 
        name: Create GitHub Release 
        needs: release 
        runs-on: ubuntu-latest 
        
        steps: 
            - name: Checkout Repository 
              uses: actions/checkout@v4 
              
            - name: Generate Changelog 
              id: changelog 
              uses: mikepenz/release-changelog-builder-action@v5 
              env: 
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
                
            - name: Create GitHub Release 
              uses: softprops/action-gh-release@v2 
              with: 
                generate_release_notes: true 
                body: | 
                    ## Docker Image 
                    ghcr.io/${{ github.repository }}:${{ github.ref_name }} 
                    
                    ## Changelog 
                    ${{ steps.changelog.outputs.changelog }} 
                    
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
                
                
    notify: 
        needs: 
            - release 
            - github-release 
            
        if: always() 
        uses: ./.github/workflows/notifications.yml 
        with: 
            status: | 
                release:${{ needs.release.result }} 
                github-release:${{ needs.github-release.result }} 
                
            environment: Production 
            title: Release Published 
            message: Version released successfully. 
            
        secrets: inherit